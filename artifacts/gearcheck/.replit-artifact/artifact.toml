kind = "mobile"
previewPath = "/"
title = "GearCheck"
description = "An offline-first Android app for photography and videography studios to track gear inventory, pack for events, verify returns, reuse event templates, and keep a reliable local event history."
version = "1.0.0"
id = "artifacts/gearcheck"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19009

[services.development]
run = "pnpm --filter @workspace/gearcheck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gearcheck", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gearcheck", "run", "serve" ]

[services.env]
PORT = "19009"
BASE_PATH = "/"
