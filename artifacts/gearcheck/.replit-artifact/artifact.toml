kind = "mobile"
previewPath = "/"
title = "GearCheck"
description = "Offline-first inventory and event packing for photo and video studios. Track packing and returns, use templates and a calendar, and delete each event after its result with no event archive."
version = "1.0.0"
id = "artifacts/gearcheck"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19009

[services.development]
run = "pnpm --filter @workspace/gearcheck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gearcheck", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gearcheck", "run", "serve" ]

[services.env]
PORT = "19009"
BASE_PATH = "/"
